<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লেখা-জোখা - মোঃ আমির হামজা</title>
    <!-- Google Fonts for Modern Bangla Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0284c7;
            --primary-dark: #0369a1;
            --light-blue-bg: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #334155;
            --heading-color: #0f172a;
            --accent-color: #e0f2fe;
            --border-color: #bae6fd;
        }

        /* -------------------------------------------------------------
           Global Reset & Touch Blue Highlight Removal
        ------------------------------------------------------------- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent; 
        }

        *:focus, *:active {
            outline: none !important;
            box-shadow: none !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Hind Siliguri', sans-serif;
            background-color: var(--light-blue-bg);
            color: var(--text-color);
            line-height: 1.6;
            font-size: 16px;
            padding: 0;
            margin: 0;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 12px 15px 30px 15px;
        }

        /* -------------------------------------------------------------
           Navigation Bar
        ------------------------------------------------------------- */
        nav.navbar {
            background-color: var(--card-bg);
            border-radius: 30px;
            padding: 8px 16px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.06);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }

        nav.navbar a {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 6px 14px;
            border-radius: 20px;
            transition: all 0.25s ease;
            user-select: none;
        }

        nav.navbar a.active, nav.navbar a:hover {
            color: var(--primary-blue);
            background-color: var(--accent-color);
        }

        nav.navbar span.dot {
            width: 4px;
            height: 4px;
            background-color: #cbd5e1;
            border-radius: 50%;
            display: inline-block;
        }

        /* -------------------------------------------------------------
           Search Bar Only (Minimal Top)
        ------------------------------------------------------------- */
        .search-container {
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 45px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            background-color: var(--card-bg);
            font-family: 'Hind Siliguri', sans-serif;
            font-size: 0.95rem;
            color: var(--heading-color);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.04);
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.12);
        }

        .search-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary-blue);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        /* -------------------------------------------------------------
           Compact Row-Based Article List (Fast Scroll UI)
        ------------------------------------------------------------- */
        .post-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .compact-post-card {
            background-color: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.03);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .compact-post-card:hover {
            border-color: var(--primary-blue);
        }

        .compact-post-card:active {
            transform: scale(0.99);
        }

        /* Thumbnail Image (Small & Square) */
        .compact-thumb {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
            background-color: var(--accent-color);
        }

        /* Content Area */
        .compact-details {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
        }

        /* Tag Box/Badge Design */
        .compact-tag {
            font-size: 0.72rem;
            color: var(--primary-blue);
            background-color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 6px;
        }

        .compact-title {
            font-size: 1rem;
            color: var(--heading-color);
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            transition: color 0.2s ease;
        }

        .compact-post-card:hover .compact-title {
            color: var(--primary-blue);
        }

        .compact-meta {
            font-size: 0.78rem;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* -------------------------------------------------------------
           No Result Container
        ------------------------------------------------------------- */
        .no-result {
            display: none;
            text-align: center;
            padding: 30px 10px;
            background-color: var(--card-bg);
            border-radius: 14px;
            border: 1px solid var(--border-color);
            color: #64748b;
            font-size: 0.95rem;
        }

        /* -------------------------------------------------------------
           Footer
        ------------------------------------------------------------- */
        footer {
            text-align: center;
            padding: 25px 0 10px 0;
            font-size: 0.85rem;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <nav class="navbar">
        <a href="index.html">হোম</a>
        <span class="dot"></span>
        <a href="articles.html" class="active">লেখা-জোখা</a>
        <span class="dot"></span>
        <a href="about.html">পরিচিতি</a>
    </nav>

    <!-- Clean Search Bar -->
    <div class="search-container">
        <div class="search-box">
            <span class="search-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" id="searchInput" class="search-input" placeholder="যেকোনো লেখা খুঁজুন..." onkeyup="filterPosts()">
        </div>
    </div>

    <!-- Compact Post List for Easy Scrolling -->
    <div class="post-list" id="postList">
        
        <!-- Post Item 1 (Water Taste Blog) -->
        <a href="water-blog.html" class="compact-post-card">
            <img src="https://i.ibb.co.com/8DQ8Rp1n/IMG-63cae6f9-721b-4571-b81e-dda5e5539419.jpg" alt="পানির স্বাদ" class="compact-thumb">
            <div class="compact-details">
                <span class="compact-tag">বিজ্ঞান ও স্নায়ুবিজ্ঞান</span>
                <h2 class="compact-title">পানির কি কোনো স্বাদ আছে নাকি কেবলই মস্তিষ্কের ভ্রম?</h2>
                <div class="compact-meta">
                    <span>২৬ সেপ্টেম্বর ২০২৬</span>
                    <span>•</span>
                    <span>৩ মিনিট</span>
                </div>
            </div>
        </a>

    </div>

    <!-- No Search Results Message -->
    <div class="no-result" id="noResult">
        🔍 আপনার সার্চের সাথে মেলে এমন কোনো লেখা পাওয়া যায়নি।
    </div>

    <!-- Footer -->
    <footer>
        &copy; ২০২৬ মোঃ আমির হামজা। সর্বস্বত্ব সংরক্ষিত।
    </footer>
</div>

<script>
    // Real-time Live Search Filter Function
    function filterPosts() {
        var input = document.getElementById('searchInput').value.toLowerCase();
        var posts = document.getElementsByClassName('compact-post-card');
        var visibleCount = 0;

        for (var i = 0; i < posts.length; i++) {
            var title = posts[i].getElementsByClassName('compact-title')[0].innerText.toLowerCase();
            var tag = posts[i].getElementsByClassName('compact-tag')[0].innerText.toLowerCase();

            if (title.includes(input) || tag.includes(input)) {
                posts[i].style.display = "flex";
                visibleCount++;
            } else {
                posts[i].style.display = "none";
            }
        }

        var noResult = document.getElementById('noResult');
        if (visibleCount === 0) {
            noResult.style.display = "block";
        } else {
            noResult.style.display = "none";
        }
    }
</script>

</body>
</html>
